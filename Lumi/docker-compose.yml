services:
  postgres:
    image: postgres:15-alpine
    container_name: lumi_postgres_clean
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_clean_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lumi_redis_clean
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_clean_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: lumi_evolution_clean
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SERVER_URL: http://localhost:8081
      DOCKER_ENV: "true"
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}

      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "#198754"
      CONFIG_SESSION_PHONE_CLIENT: "Evolution API V2"
      CONFIG_SESSION_PHONE_NAME: Chrome

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_clean

      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_DATA_LABELS: "false"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution_clean
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - evolution_clean_instances:/evolution/instances

volumes:
  evolution_clean_pgdata:
    name: lumi_evolution_clean_pgdata
  evolution_clean_redis_data:
    name: lumi_evolution_clean_redis_data
  evolution_clean_instances:
    name: lumi_evolution_clean_instances